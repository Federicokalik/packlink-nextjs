name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Lets npm authenticate through trusted publishing (OIDC) and sign provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run format:check
      # prepublishOnly runs typecheck, tests and build.
      - run: npm publish
